---
# Esempio di inventory — gestisci l'inventory reale in Semaphore UI
# oppure crea una copia locale `inventory/hosts.yml` (ignorata da git).
all:
  vars:
    ansible_user: admin
  children:
    servers:
      hosts:
        lab-node-01:
          ansible_host: 192.0.2.10
        lab-node-02:
          ansible_host: 192.0.2.11
    docker_hosts:
      hosts:
        lab-docker-01:
          ansible_host: 192.0.2.20
